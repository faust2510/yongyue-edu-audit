name: edu19-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: odoo:19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"   # HTTP（nginx 反代）
      - "127.0.0.1:8072:8072"   # WebSocket
    volumes:
      - ./openeducat_erp:/mnt/extra-addons
      - ./custom_addons:/mnt/custom-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./data/web:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
