# 中国直连入口 —— 站点本体（TLS）。2026-09-24 立；2026-10-01 换机后改为**直听 443**。
#
# 2026-10-01 变更（换新机 203.0.113.11）：
#   旧机用 HAProxy 按 SNI 分流，再以 PROXY protocol v2 送进 nginx 的 127.0.0.1:10443
#   （因为那台机 443 上还跑着别的 TLS 服务，必须按 SNI 分流）。
#   新机是干净的、443 上没有别的占用 ⇒ **去掉 HAProxy 这一跳**，nginx 直接 listen 443。
#   好处：少一个组件；真实客户端 IP 天然就是 $remote_addr，不再需要 proxy_protocol 还原
#   （旧版若照抄，set_real_ip_from 127.0.0.1 + proxy_protocol 在直连下会把所有访客算成同一个 IP，
#    限流与登录防爆破会一起失真）。
#   若将来又要在 443 上共存其它 TLS 服务，再恢复 HAProxy 版（git 历史里有）。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx ≥1.25 写法；旧的 listen ... http2 会打 deprecated 警告
    server_name cn.edu.example.org;

    ssl_certificate     /etc/letsencrypt/live/cn.edu.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cn.edu.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:edu_cn_ssl:5m;
    ssl_session_timeout 1h;

    client_max_body_size 100m;

    # 直连绕过 CF ⇒ nginx 兜底限流（zone 定义在 conf.d/edu-cn-ratelimit.conf）
    limit_conn edu_cn_conn 40;
    limit_req  zone=edu_cn_all burst=60 nodelay;

    # 与主站一致：HTML 不缓存（P0-CSRF 加固）
    add_header Cache-Control "no-store, must-revalidate" always;

    location ~* ^/web/assets/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(edu_[a-z_]+|openeducat_[a-z_]+)/static/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location ~* ^/web/static/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    # 登录入口收紧：2r/s，突发 30（一间教室共用出口 NAT 也够用）
    location ~ ^/(web/login|login)$ {
        limit_req zone=edu_cn_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /websocket {
        proxy_pass http://127.0.0.1:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
    }
}