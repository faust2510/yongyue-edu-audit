# 中国直连入口限流（2026-09-24 立）
# 背景：cn.edu.example.org 走灰云直连，绕过了 Cloudflare 的 WAF/DDoS 防护 ⇒ nginx 侧兜底。
# limit_req_zone / limit_conn_zone 只能在 http 上下文定义，故放 conf.d。
limit_req_zone  $binary_remote_addr zone=edu_cn_all:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=edu_cn_login:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=edu_cn_conn:10m;
