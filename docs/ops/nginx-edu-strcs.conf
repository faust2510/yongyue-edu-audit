# 永约学坊教务系统 (Odoo 19) @ edu.example.org — Cloudflare 橙云 → nginx → docker odoo
server {
    listen 80;
    listen [::]:80;
    server_name edu.example.org;

    client_max_body_size 100m;

    # P0-CSRF 加固：HTML 不缓存（防登录页/csrf 过期被中间层放大）
    add_header Cache-Control "no-store, must-revalidate" always;

    # 版本化资产：哈希路径安全可缓存（覆盖继承的 no-store）
    location ~* ^/web/assets/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # 2026-09-24（中国链路诊断）：模块静态资源原先被上面的全局 no-store 连带覆盖 ⇒
    # 每次开页重下 252KB 校徽 + 77KB 字体，且 Cloudflare 侧 cf-cache-status=BYPASS。
    # Odoo 自身对 /static/ 的语义就是 STATIC_CACHE=7 天（odoo/http.py Stream.from_path），
    # 这里恢复其本意，并补 CDN-Cache-Control 让边缘也缓存。
    # ⚠ 以后替换同名图片，需等缓存过期（或改名），否则访客/边缘 7 天内看不到新图。
    location ~* ^/(edu_[a-z_]+|openeducat_[a-z_]+)/static/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header CDN-Cache-Control "public, max-age=604800" always;
    }

    # Odoo 核心静态文件（字体/libs）：与上游 STATIC_CACHE 对齐
    location ~* ^/web/static/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header CDN-Cache-Control "public, max-age=604800" always;
    }

    proxy_read_timeout 720s;
    proxy_send_timeout 720s;

    location /websocket {
        proxy_pass http://127.0.0.1:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
