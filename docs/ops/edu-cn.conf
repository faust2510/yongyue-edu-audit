# 中国直连入口 —— 80 端口仅做 ACME 验证与跳转 HTTPS（2026-09-24 立）
# 流量路径：访客 → cn.edu.example.org（A=203.0.113.10，灰云，不经 CF）
#          → HAProxy :443（按 SNI 分流）→ 本机 nginx TLS 127.0.0.1:10443 → Odoo 8069
# 起因：中国移动 → Cloudflare 洛杉矶（cf-ray …-LAX）跨太平洋段丢包 66.7%，
#      15 次请求 6 次超时；而直连本机 0% 丢包 / 0.5-0.8s。主站 edu.example.org 走 CF 隧道不变。
# 回滚：rm /etc/nginx/sites-enabled/edu-cn /etc/nginx/sites-enabled/edu-cn-tls \
#      && nginx -t && systemctl reload nginx  （HAProxy 侧见其配置注释）
server {
    listen 80;
    listen [::]:80;
    server_name cn.edu.example.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
