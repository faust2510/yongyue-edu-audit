backend edu_cn_backend
    # 中国直连入口：站点本体（nginx TLS，2026-09-24 立）
    # send-proxy-v2：把真实客户端 IP 透传给 nginx —— 否则限流会把所有人算成 127.0.0.1
    # 停用：删本 backend + 上面 is_edu_cn 两行，然后 systemctl reload haproxy
    server edu_cn 127.0.0.1:10443 check send-proxy-v2

    acl is_xray req.ssl_sni -i www.cloudflare.com
    use_backend xray_backend if is_xray
    acl is_edu_cn req.ssl_sni -i cn.edu.example.org
    use_backend edu_cn_backend if is_edu_cn
    default_backend mtg_backend

--
    # 中国直连入口：站点本体（nginx TLS，2026-09-24 立）
