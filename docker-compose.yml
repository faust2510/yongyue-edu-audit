name: edu19-clone

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      # 2026-09-14 修（见 docs/plans/ux-v3-delivery.md §2.5 #20）：
      # 原先只写 -U odoo —— pg_isready 不带 -d 时把「库名」默认成用户名，
      # 本环境只有 edu19/postgres 两个库 ⇒ 每 5 秒一条 FATAL: database "odoo" does not exist；
      # 且 pg_isready 的语义是「服务器有应答即 0」，与库名/口令是否正确无关
      # ⇒ 该探针永远抓不到「库没了」。补 -d postgres：噪音消失 + 库缺失才判不健康。
      # 故意不用 -d edu19：新环境里 edu19 由 web 容器首次运行时创建，探针若要求它存在，
      # 会与 depends_on: service_healthy 构成死锁。
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: odoo:19
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"   # HTTP
      - "8072:8072"   # WebSocket（Odoo 19 必需，否则聊天/通知会挂）
    volumes:
      - ./openeducat_erp:/mnt/extra-addons
      - ./custom_addons:/mnt/custom-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./data/web:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
